# cloudflared 到本机是 http，$scheme 永远是 http；优先沿用上游传入的 proto
map $http_x_forwarded_proto $cmcc_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 5701;
    listen [::]:5701;

    # 仅 www 指向退订工具；裸域继续由 default_server 提供原首页
    server_name www.example.com;

    # 退订流程会复用一个大 Cookie 会话，放宽 body 限制
    client_max_body_size 4m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $cmcc_proto;

    location / {
        proxy_pass http://127.0.0.1:8686;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}
